<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رفيق | تجربة الوكيل</title>
<style>
:root{color-scheme:light;--ink:#182230;--muted:#667085;--line:#d9e0e8;--bg:#f5f7fa;--accent:#165d59}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
main{width:min(820px,calc(100% - 28px));margin:36px auto}header,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
header{margin-bottom:16px}h1{margin:0 0 8px;font-size:1.7rem}p{line-height:1.7}.muted{color:var(--muted);margin:0}
.examples{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#fff;color:var(--ink)}
button:hover{border-color:var(--accent)}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
textarea{width:100%;min-height:125px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:14px;font:inherit;line-height:1.6}
.actions{display:flex;align-items:center;gap:12px;margin-top:12px}#status{color:var(--muted);font-size:.95rem}
#output{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fbfcfd;min-height:90px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}
.notice{margin-top:14px;font-size:.9rem;color:var(--muted)}
@media(max-width:520px){main{margin:16px auto}header,.panel{padding:16px}.actions{align-items:stretch;flex-direction:column}}
</style>
</head>
<body>
<main>
<header><h1>رفيق — تجربة الوكيل</h1>
<p class="muted">مساعد تجريبي للاستفسار عن سياسات عربات الطعام وتجهيز مسودة طلب. هذه نسخة تعليمية ببيانات اصطناعية.</p></header>
<section class="panel">
<strong>جرّب مثالًا</strong>
<div class="examples">
<button type="button" data-message="ما شروط الحصول على تصريح عربة طعام؟">السؤال عن السياسة</button>
<button type="button" data-message="أريد إنشاء مسودة تصريح لعربة طعام. اسم المتقدم أحمد، والموقع جدة.">بيانات ناقصة</button>
<button type="button" data-message="أنشئ مسودة تعليمية لتصريح عربة طعام. اسم المتقدم: أحمد، المكان: جدة، النشاط: بيع القهوة، التواصل: 0500000000">إنشاء مسودة</button>
</div>
<label for="message"><strong>رسالتك</strong></label>
<textarea id="message" placeholder="اكتب سؤالك هنا..."></textarea>
<div class="actions"><button class="primary" id="send" type="button">إرسال إلى رفيق</button>
<button id="clear" type="button">مسح النتيجة</button><span id="status" role="status" aria-live="polite"></span></div>
<div id="output" aria-live="polite">ستظهر إجابة الوكيل هنا.</div>
<p class="notice">تنبيه: السياسات والطلبات تجريبية وليست لوائح رسمية، وإنشاء المسودة لا يعني تقديم الطلب أو الموافقة عليه.</p>
</section></main>
<script>
const messageBox=document.getElementById("message"),output=document.getElementById("output"),status=document.getElementById("status"),sendButton=document.getElementById("send");
document.querySelectorAll("[data-message]").forEach(button=>button.addEventListener("click",()=>{messageBox.value=button.dataset.message;messageBox.focus()}));
document.getElementById("clear").addEventListener("click",()=>{output.textContent="ستظهر إجابة الوكيل هنا.";status.textContent=""});
sendButton.addEventListener("click",async()=>{
 const message=messageBox.value.trim();if(!message){status.textContent="اكتب رسالة أولاً.";return}
 sendButton.disabled=true;status.textContent="رفيق يعالج طلبك...";output.textContent="";
 try{
  const response=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})});
  const data=await response.json();if(!response.ok)throw new Error(data.error||"حدث خطأ أثناء الطلب.");
  output.textContent=typeof data.result==="string"?data.result:JSON.stringify(data.result,null,2);status.textContent="اكتمل الطلب.";
 }catch(error){output.textContent=error.message+"\n\nتأكد أن خادم رفيق يعمل وأن مفتاح OpenRouter مضبوط.";status.textContent="تعذر تنفيذ الطلب."}
 finally{sendButton.disabled=false}
});
</script>
</body></html>
